name: Build and publish PyPI package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  # Create and verify release artifacts
  # - build source dist (tarball) and wheel
  # - upload artifacts to GHA
  build-package:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout containers/ramalama
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect python package
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: |
            ${{ github.repository_owner == 'containers' && (
                  github.event.action == 'published' ||
                  ( github.event_name == 'push' && github.ref == 'refs/heads/main' )
                ) && 'true' || 'false'
            }}

  # push to Test PyPI on
  # - a new GitHub release is published
  # - a PR is merged into main branch
  publish-test-pypi:
    name: Publish packages to test.pypi.org
    if: |
      github.repository_owner == 'containers' && (
        github.event.action == 'published' ||
        ( github.event_name == 'push' && github.ref == 'refs/heads/main' )
      )
    permissions:
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ramalama
    needs: build-package
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Fetch build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  # push to Production PyPI on
  # - a new GitHub release is published
  publish-pypi:
    name: Publish release to pypi.org
    if: github.repository_owner == 'containers' && github.event.action == 'published'
    permissions:
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # allow gh release upload
      contents: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ramalama
    needs: build-package
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Fetch build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Upload artifacts to GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload '${{ github.ref_name }}' dist/* --repo '${{ github.repository }}'

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
