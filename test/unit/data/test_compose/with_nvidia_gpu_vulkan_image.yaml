# Save this output to a 'docker-compose.yaml' file and run 'docker compose up'.
#
# Created with ramalama-0.1.0-test
services:
  gemma-vulkan:
    container_name: ramalama-gemma-vulkan
    image: test-image/ramalama:latest
    volumes:
      - "/models/gemma.gguf:/mnt/models/gemma.gguf:ro"
    ports:
      - "8080:8080"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    devices:
      - "/dev/accel:/dev/accel"
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
